name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every file matches its spec, and the generated schemas match the specs.
  specs:
    name: specs
    runs-on: ubuntu-latest
    env:
      # Keep in step with cue.mod/module.cue.
      CUE_VERSION: v0.17.1
    steps:
      - uses: actions/checkout@v4
      # The release download fails now and then (GitHub answering 504), so
      # cue is cached per version, and fetched with retries only on a miss.
      - name: Cache cue
        id: cue-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/cue
          key: cue-${{ env.CUE_VERSION }}-linux-amd64
      - name: Install cue
        if: steps.cue-cache.outputs.cache-hit != 'true'
        # To a file, not piped into tar: a retry would append to a half-read
        # stream.
        run: |
          mkdir -p ~/.local/cue
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o cue.tar.gz \
            "https://github.com/cue-lang/cue/releases/download/$CUE_VERSION/cue_${CUE_VERSION}_linux_amd64.tar.gz"
          tar -xzf cue.tar.gz -C ~/.local/cue cue
          rm cue.tar.gz
      - run: echo "$HOME/.local/cue" >> "$GITHUB_PATH"
      - run: specs/check.sh --check
      - name: VERSION is a spec version
        run: grep -Eqx '[0-9]+\.[0-9]+' VERSION

  # The comline-catalog crate (rust/): its tests, its minimum Rust, and a
  # no_std build. specs/check.sh above keeps its generated data current.
  rust:
    name: rust crate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable 1.82.0 --profile minimal --component clippy
      - run: rustup target add wasm32-unknown-unknown --toolchain stable
      - run: cargo +stable test
      - run: cargo +stable clippy --all-targets -- -D warnings
      - run: cargo +1.82.0 check
      - run: cargo +stable build --target wasm32-unknown-unknown
